# Конфиг линтера Python (ruff) — задача ТЗ #27.
#
# Осознанно узкий набор правил: проверяем реальные ошибки (неопределённые имена,
# неиспользуемые импорты/переменные, синтаксис, базовая стилистика), но НЕ
# навязываем модернизацию кода (UP), порядок импортов (I) или запрет except
# Exception — это большой и рискованный объём правок для живой кодовой базы.
#
# Запуск:  ruff check .          (из корня репозитория)
#          ruff check . --fix    (автоисправления)

line-length = 120
target-version = "py310"

[lint]
select = ["E4", "E7", "E9", "F", "W"]
ignore = [
    # E402 — осознанные поздние импорты (sys.path до inc.*, mpl.use('Agg') до pyplot).
    "E402",
    # E501 — длинные строки в отчётах/текстах ошибок; ограничиваем мягко (line-length).
    "E501",
]

exclude = [
    ".venv",
    "node_modules",
    "__pycache__",
    "_cache",
]
