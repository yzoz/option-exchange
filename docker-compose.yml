# YZoZ Option Exchange.
#
# Хранилища (Mongo + Memcached + InfluxDB 1.8) поднимаются всегда:
#     docker compose up -d
# Приложения (Python API/планировщик и Node-веб) — в профиле «app» (задача ТЗ #21):
#     docker compose --profile app up -d
# Переменные берутся из .env (см. .env.example). InfluxDB — строго 1.8
# (python-клиент из кода несовместим с InfluxDB 2.x).
services:
  mongo:
    image: mongo:6.0
    container_name: eq-mongo
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-yzoz_admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-change-me-mongo-password}
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ping:1}).ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  memcached:
    image: memcached:1.6
    container_name: eq-memcached
    restart: unless-stopped
    command: -m 64
    ports:
      - "${MEMCACHED_PORT:-11211}:11211"

  influx:
    image: influxdb:1.8
    container_name: eq-influx
    restart: unless-stopped
    ports:
      - "${INFLUX_PORT:-8086}:8086"
    environment:
      INFLUXDB_HTTP_AUTH_ENABLED: "false"
    volumes:
      - influx-data:/var/lib/influxdb
      # Автосоздание баз orders/trades/spot при первом старте.
      - ./docker/influx-init.iql:/docker-entrypoint-initdb.d/init.iql:ro
    healthcheck:
      test: ["CMD", "curl", "-s", "-o", "/dev/null", "-w", "%{http_code}", "http://localhost:8086/ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    profiles: ["app"]
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    container_name: eq-api
    restart: unless-stopped
    # Внутри сети compose хосты — по именам сервисов (не localhost).
    # PY_MODE=dev: bottle поднимает встроенный сервер на API_HOST:API_PORT.
    # Однопроцессный режим здесь осознан: блокировка матчинга и rate-limit
    # локальны для процесса (см. docs/DONE.md) — несколько воркеров их сломают.
    environment:
      PY_MODE: dev
      API_HOST: 0.0.0.0
      API_PORT: 6969
      MONGO_HOST: mongo
      MONGO_PORT: 27017
      INFLUX_HOST: influx
      INFLUX_PORT: 8086
      MEMCACHED_HOST: memcached
      MEMCACHED_PORT: 11211
      MONGO_USER: ${MONGO_USER:-yzoz_admin}
      MONGO_PASSWORD: ${MONGO_PASSWORD:-change-me-mongo-password}
      MONGO_DB: ${MONGO_DB:-exchange}
      INFLUX_USER: ${INFLUX_USER:-}
      INFLUX_PASSWORD: ${INFLUX_PASSWORD:-}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-change-me-admin-token}
      # Origin, с которого браузер ходит в API (веб на хосте: localhost:3000).
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
    ports:
      - "${API_PORT:-6969}:6969"
    depends_on:
      mongo:
        condition: service_healthy
      influx:
        condition: service_healthy
      memcached:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:6969/health', timeout=3).status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5

  theo:
    profiles: ["app"]
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    container_name: eq-theo
    restart: unless-stopped
    command: python api/theo.py
    environment:
      PY_MODE: dev
      MONGO_HOST: mongo
      MONGO_PORT: 27017
      INFLUX_HOST: influx
      INFLUX_PORT: 8086
      MEMCACHED_HOST: memcached
      MEMCACHED_PORT: 11211
      MONGO_USER: ${MONGO_USER:-yzoz_admin}
      MONGO_PASSWORD: ${MONGO_PASSWORD:-change-me-mongo-password}
      MONGO_DB: ${MONGO_DB:-exchange}
      INFLUX_USER: ${INFLUX_USER:-}
      INFLUX_PASSWORD: ${INFLUX_PASSWORD:-}
    depends_on:
      mongo:
        condition: service_healthy
      influx:
        condition: service_healthy
      memcached:
        condition: service_started

  web:
    profiles: ["app"]
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    container_name: eq-web
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      WEB_HOST: 0.0.0.0
      WEB_PORT: 3000
      # Браузер обращается к API по адресу с хоста — поэтому здесь localhost,
      # а не имя сервиса (см. API_URL в .env).
      API_URL: ${API_URL:-http://localhost:6969}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  mongo-data:
  influx-data:
